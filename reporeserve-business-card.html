<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=20260325svg" />
      <title>RepoReserve Business Card</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="description" content="Printable RepoReserve business card layout." />
  <style>
    :root {
      --card-width: 3.5in;
      --card-height: 2in;
      --pad-x: 18px;
      --pad-y: 14px;
      --header-h: 56px;

      --blue: #1e5eff;
      --navy: #0f2a60;
      --ink: #111827;
      --muted: #5c687b;
      --soft: #8a96a9;
      --line: #d6dfeb;
      --paper: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    @page {
      size: 3.5in 2in;
      margin: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #f4f7fb 0%, #e8eff8 100%);
      font-family: "Inter", "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
    }

    .card {
      width: var(--card-width);
      height: var(--card-height);
      background-image:
        linear-gradient(180deg, #0f2a60 0 var(--header-h), #ffffff var(--header-h) 100%);
      border: 1px solid #c9d5e6;
      border-radius: 9px;
      box-shadow: 0 14px 28px rgba(14, 29, 57, 0.14);
      position: relative;
      overflow: hidden;
    }

    .content {
      padding: var(--pad-y) var(--pad-x);
      display: flex;
      flex-direction: column;
      text-align: left;
      height: 100%;
    }

    .brand {
      min-height: calc(var(--header-h) - var(--pad-y));
    }

    .company {
      font-size: 17.2px;
      line-height: 1.04;
      letter-spacing: -0.011em;
      font-weight: 700;
      color: #f3f7ff;
    }

    .company-meta {
      margin-top: 4px;
      font-size: 8.3px;
      line-height: 1.28;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #c8d8f8;
      font-weight: 500;
    }

    .identity {
      margin-top: 9px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
    }

    .name {
      font-size: 13.8px;
      line-height: 1.2;
      font-weight: 600;
      color: var(--blue);
    }

    .title {
      margin-top: 2px;
      font-size: 9.9px;
      line-height: 1.3;
      color: #667388;
      font-weight: 500;
    }

    .contact {
      margin-top: 8px;
      display: grid;
      gap: 3px;
      font-size: 9.8px;
      line-height: 1.35;
      color: #192336;
      font-weight: 500;
    }

    .tagline {
      margin-top: auto;
      padding-top: 9px;
      border-top: 1px solid #e6edf7;
      font-size: 7.5px;
      line-height: 1.35;
      color: var(--soft);
      letter-spacing: 0.02em;
      font-weight: 500;
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }

      .card {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="RepoReserve business card">
    <div class="content">
      <header class="brand">
        <div class="company">RepoReserve</div>
        <div class="company-meta">
          Technologies Private Limited<br />
          Hyderabad, India
        </div>
      </header>

      <section class="identity">
        <div class="name">Rakesh Kottha</div>
        <div class="title">Founder &amp; CEO</div>
      </section>

      <section class="contact">
        <div>+91 9381642170</div>
        <div>rakesh@reporeserve.com</div>
        <div>www.reporeserve.com</div>
      </section>

      <footer class="tagline">Optimizing collateral and liquidity for treasury operations</footer>
    </div>
  </main>
</body>
</html>
