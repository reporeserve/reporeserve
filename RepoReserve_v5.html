/* ═══ RECALCULATE ALL (single source of truth) ═══ */
function recalcAll(){const m=Z.met;
m.cap=Z.col.filter(c=>!c.encumbered).reduce((s,c)=>s+cp(c),0);
m.util=Z.req.filter(r=>r.status==='Settled').reduce((s,r)=>s+r.amount,0);
m.exp=Z.req.filter(r=>!['Draft','Rejected','Closed','Failed'].includes(r.status)).reduce((s,r)=>s+r.amount,0);
m.head=m.cap-m.util;m.utilPct=m.cap>0?(m.util/m.cap)*100:0;
m.pend=Z.req.filter(r=>['Submitted','Risk Review'].includes(r.status)).length;
m.alerts=Z.req.filter(r=>r.policy_flags?.length>0&&!['Settled','Closed','Rejected','Failed'].includes(r.status)).length;
const inf=SD_L.filter(e=>e.direction==='inflow').reduce((s,e)=>s+e.amount,0);
const outf=SD_L.filter(e=>e.direction==='outflow').reduce((s,e)=>s+e.amount,0);
m.gap=inf-outf;m.lastUp=Date.now();
Z.custSummary.forEach(cs=>{cs.repoable=custRepo(cs.id)})}

function drawGauge(id,pct){const cv=document.getElementById(id);if(!cv)return;const ctx=cv.getContext('2d'),w=cv.width,h=cv.height,cx=w/2,cy=h-20,r=Math.min(cx,cy)-10;ctx.clearRect(0,0,w,h);ctx.lineWidth=18;
ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,2*Math.PI);ctx.strokeStyle='#1E293B';ctx.stroke();
[[0,.6,'#22C55E33'],[.6,.8,'#F59E0B33'],[.8,1,'#EF444433']].forEach(([s,e,c])=>{ctx.beginPath();ctx.arc(cx,cy,r,Math.PI+Math.PI*s,Math.PI+Math.PI*e);ctx.strokeStyle=c;ctx.stroke()});
const p=Math.min(Math.max(pct,0),100)/100,clr=p<.6?'#22C55E':p<.8?'#F59E0B':'#EF4444';
ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,Math.PI+Math.PI*p);ctx.strokeStyle=clr;ctx.lineCap='round';ctx.stroke();
ctx.fillStyle=clr;ctx.font='800 26px Inter';ctx.textAlign='center';ctx.fillText(`${pct.toFixed(1)}%`,cx,cy-10);

let body='';
if(step===0)body=`<div class="g2"><div><label class="tx tm f6" style="display:block;margin-bottom:4px">Amount (₹)</label><input id="wa" type="number" style="width:100%" value="${f.amount}" placeholder="1000000000"></div><div><label class="tx tm f6" style="display:block;margin-bottom:4px">Tenor</label><select id="wt" style="width:100%">${[1,3,7,14,30,60,90].map(d=>`<option value="${d}" ${f.tenor_days==d?'selected':''}>${d}d</option>`).join('')}</select></div><div><label class="tx tm f6" style="display:block;margin-bottom:4px">Venue</label><select id="wv" style="width:100%"><option ${f.venue==='TREPS'?'selected':''}>TREPS</option><option ${f.venue==='Broker'?'selected':''}>Broker</option></select></div><div><label class="tx tm f6" style="display:block;margin-bottom:4px">Rate (%)</label><input id="wr" type="number" step="0.01" style="width:100%" value="${f.rate}"></div><div><label class="tx tm f6" style="display:block;margin-bottom:4px">Desk</label><select id="wd" style="width:100%">${['Fixed Income','Money Market','ALM','Treasury Ops'].map(d=>`<option ${f.desk===d?'selected':''}>${d}</option>`).join('')}</select></div></div>`;
else if(step===1){const av=Z.col.filter(c=>!c.encumbered),sel=Z.wSel,tc=av.filter(c=>sel.includes(c.isin)).reduce((s,c)=>s+cp(c),0);body=`<div style="max-height:300px;overflow:auto"><table><thead><tr><th></th><th>ISIN</th><th>Instrument</th><th>MV</th><th>Capacity</th><th>Reserved</th></tr></thead><tbody>${av.map(c=>`<tr><td><input type="checkbox" ${sel.includes(c.isin)?'checked':''} onchange="twc('${c.isin}')"></td><td class="mono ts">${c.isin}</td><td>${c.instrument}</td><td class="mono">${fmt(c.market_value)}</td><td class="mono ta f6">${fmt(cp(c))}</td><td>${c.reserved_by?`<span class="res-bdg">${c.reserved_by}</span>`:'—'}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:12px;padding:12px;background:var(--bgp);border-radius:8px" class="fx jcb aic"><span class="ts tm">Selected: ${sel.length}</span><span class="mono f7" style="color:${tc>=Number(f.amount)?'var(--ok)':'var(--er)'}">Capacity: ${fmt(tc)}</span></div>`}
else if(step===2){const r=Z.wR;if(!r)body='<div class="tm" style="text-align:center;padding:40px">Computing...</div>';else{const c=r.score==='Low'?'var(--ok)':r.score==='Medium'?'var(--wn)':'var(--er)';body=`<div class="fx fxc aic gap16" style="padding:20px"><div class="f7" style="font-size:16px">Risk Assessment</div><div class="rcirc" style="border-color:${c};color:${c}">${r.score}</div>${r.flags.length?`<div class="fx gap6" style="flex-wrap:wrap;justify-content:center">${r.flags.map(f=>bg(f.replace(/_/g,' '),'#EF4444')).join(' ')}</div>`:`<span class="ts tok f6">All checks passed</span>`}</div>`}}
else{const sc=Z.col.filter(c=>Z.wSel.includes(c.isin)),tc=sc.reduce((s,c)=>s+cp(c),0),r=Z.wR,pkt={request_id:'RR-XXXX',amount:Number(f.amount),tenor_days:Number(f.tenor_days),collateral:sc.map(c=>({isin:c.isin,market_value:c.market_value,haircut_pct:c.haircut_pct})),preferred_venue:f.venue,requested_rate:Number(f.rate),created_by:`user_${Z.role.toLowerCase()}_1`,timestamp:now(),calc_version:'1.0.0'};body=`<div class="g2 mb16">${[['Amount',fmt(Number(f.amount))],['Tenor',f.tenor_days+'d'],['Venue',f.venue],['Rate',f.rate+'%'],['Desk',f.desk],['Capacity',fmt(tc)],['Risk',r?.score||'—']].map(([l,v])=>`<div><div class="tx tm uc f6">${l}</div><div class="f7">${v}</div></div>`).join('')}</div><div class="exec-pre"><div class="tx f7 tm uc">Execution Packet Preview</div><pre>${esc(JSON.stringify(pkt,null,2))}</pre></div>`}
oM('New Repo Request',bar+body+`<div class="fx jcb" style="margin-top:24px;padding-top:16px;border-top:1px solid var(--bdr)"><button class="bs" onclick="${step===0?'cM()':'wBk()'}">${step===0?'Cancel':'Back'}</button><div class="fx gap8">${step===3?'<button class="bs" onclick="wSb(1)">Save Draft</button>':''}${step<3?`<button class="bp" onclick="wNx()">Next</button>`:`<button class="bp" onclick="wSb(0)">Submit Request</button>`}</div></div>`,true)}
function wNx(){const f=Z.wF;if(Z.wS===0){f.amount=document.getElementById('wa').value;f.tenor_days=document.getElementById('wt').value;f.venue=document.getElementById('wv').value;f.rate=document.getElementById('wr').value;f.desk=document.getElementById('wd').value;if(!f.amount){toast('Enter amount','error');return}}if(Z.wS===1){if(!Z.wSel.length){toast('Select collateral','error');return}Z.wR=cRisk(Number(f.amount),Z.col.filter(c=>Z.wSel.includes(c.isin)).map(c=>({isin:c.isin,market_value:c.market_value,haircut_pct:c.haircut_pct})),Z.pol,Z.req)}Z.wS++;renderWiz()}
function wBk(){Z.wS--;renderWiz()}
function twc(isin){const i=Z.wSel.indexOf(isin);if(i>=0)Z.wSel.splice(i,1);else Z.wSel.push(isin);renderWiz()}
function wSb(draft){const f=Z.wF,id=`RR-${String(Z.idc++).padStart(4,'0')}`,sc=Z.col.filter(c=>Z.wSel.includes(c.isin)).map(c=>({isin:c.isin,market_value:c.market_value,haircut_pct:c.haircut_pct})),risk=Z.wR||cRisk(Number(f.amount),sc,Z.pol,Z.req);Z.req.unshift({request_id:id,created_by:`user_${Z.role.toLowerCase()}_1`,amount:Number(f.amount),tenor_days:Number(f.tenor_days),collateral:sc,preferred_venue:f.venue,requested_rate:Number(f.rate),status:draft?'Draft':'Submitted',risk_score:risk.score,policy_flags:risk.flags,created_at:now(),desk:f.desk});addA(`user_${Z.role.toLowerCase()}_1`,draft?'Draft':'Submitted',id,'request',{});cM();stateChanged(draft?'Draft saved':'Request submitted')}

function rvM(id){const r=Z.req.find(x=>x.request_id===id);if(!r)return;oM(`Review ${r.request_id}`,`<div class="g2"><div>${[['Amount',fmt(r.amount)],['Tenor',r.tenor_days+'d'],['Venue',r.preferred_venue],['Risk',r.risk_score]].map(([l,v])=>`<div class="mb12"><div class="tx tm uc f6">${l}</div><div class="f7">${v}</div></div>`).join('')}${r.policy_flags?.length?r.policy_flags.map(f=>bg(f.replace(/_/g,' '),'#EF4444')).join(' '):''}</div><div><div class="mb12"><label class="tx tm f6" style="display:block;margin-bottom:4px">Execution Method</label><select id="rvm" style="width:100%"><option>TREPS</option><option>Broker</option></select></div><div class="mb12"><label class="tx tm f6" style="display:block;margin-bottom:4px">Comments</label><textarea id="rvc" style="width:100%;height:80px;resize:vertical" placeholder="Required for reject..."></textarea></div><div class="fx gap8"><button class="bok" onclick="Z.req.find(x=>x.request_id==='${r.request_id}').status='Approved';addA('risk_manager_1','Approved','${r.request_id}','approval',{method:document.getElementById('rvm')?.value});cM();stateChanged('Approved → Ready')">Approve</button><button class="ber" onclick="if(!document.getElementById('rvc').value.trim()){toast('Comment required for reject','error');return}Z.req.find(x=>x.request_id==='${r.request_id}').status='Rejected';addA('risk_manager_1','Rejected','${r.request_id}','approval',{comment:document.getElementById('rvc').value});cM();stateChanged('Rejected')">Reject</button></div></div></div>`,true)}

<div class="card oa"><table><thead><tr><th>ISIN</th><th>Instrument</th><th>Type</th><th>MV</th><th>Haircut</th><th>Capacity</th><th>Custodian</th><th>Status</th><th>Sync</th><th>Actions</th></tr></thead><tbody>${c.filter(x=>{const s=(document.getElementById('cS')?.value||'').toLowerCase();return!s||x.isin.toLowerCase().includes(s)||x.instrument.toLowerCase().includes(s)}).map(x=>`<tr><td class="mono ts">${x.isin}</td><td>${x.instrument}</td><td>${bg(x.type,'#0174FC')}</td><td class="mono">${fmt(x.market_value)}</td><td>${x.haircut_pct}%</td><td class="mono ta f6">${fmt(cp(x))}</td><td class="ts">${x.custody_account}</td><td>${x.encumbered?bg('Encumbered','#EF4444'):x.reserved_by?`<span class="res-bdg">${x.reserved_by}</span>`:bg('Free','#22C55E')}</td><td><span class="sd" style="background:${syncClr(x.last_sync)}" title="Synced ${new Date(x.last_sync).toLocaleTimeString()}"></span></td><td>${!x.encumbered&&!x.reserved_by?`<button class="bp bsm" onclick="reserveISIN('${x.isin}')">Reserve</button>`:x.reserved_by?`<button class="bs bsm" onclick="releaseISIN('${x.isin}')">Release</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}

/* ═══ FEATURE 5: EXECUTION with Packet Preview + IK Dedup ═══ */
let eF='All';
function rExec(){const el=document.getElementById('t-execution'),ap=Z.req.filter(r=>r.status==='Approved'),exs=eF==='All'?Z.exec:Z.exec.filter(e=>e.status.toLowerCase().includes(eF.toLowerCase()));el.innerHTML=`<div class="pills mb16">${['All','Submitted','Pending Settlement','Settled','Failed'].map(f=>`<button class="pill ${eF===f?'on':''}" onclick="eF='${f}';rExec()">${f}</button>`).join('')}</div>${ap.length?`<div class="card mb20" style="border-left:3px solid var(--brand)"><div class="tx f7 tm uc mb12">Ready to Execute (${ap.length})</div>${ap.map(r=>`<div class="fx jcb aic" style="padding:10px 0;border-bottom:1px solid var(--bdr)"><div><span class="mono ta f7 ts">${r.request_id}</span><span class="ts" style="margin-left:12px">${fmt(r.amount)} · ${r.preferred_venue}</span></div><button class="bp bsm" onclick="showExecPreview('${r.request_id}')">Preview & Execute</button></div>`).join('')}</div>`:''}<div class="card oa"><table><thead><tr><th>Exec</th><th>Req</th><th>Amount</th><th>Venue</th><th>Status</th><th>IK</th><th>Time</th><th></th></tr></thead><tbody>${exs.map(e=>`<tr><td class="mono f7 ts">${e.execution_id}</td><td class="mono ta ts">${e.request_id}</td><td class="mono">${fmt(e.amount)}</td><td>${vBg(e.venue)}</td><td>${sBg(e.status)}</td><td class="mono tx tm">${e.ik||'—'}</td><td class="ts tm">${fD(e.timestamp)}</td><td>${e.status==='Failed'?`<button class="ber bsm" onclick="retryExec('${e.execution_id}')">Retry</button>`:''}</td></tr>`).join('')}</tbody></table>${exs.length===0?'<div style="text-align:center;padding:40px" class="tm">No records</div>':''}</div>`}

function showExecPreview(rid){if(!['TreasuryUser','Admin'].includes(Z.role)){toast('No permission','error');return}
const r=Z.req.find(x=>x.request_id===rid);if(!r)return;const ik=`IK-${rid}-${Date.now().toString(36)}`;
const pkt={request_id:r.request_id,amount:r.amount,collateral:r.collateral,venue:r.preferred_venue,tenor_days:r.tenor_days,created_by:r.created_by,timestamp:now(),calc_version:'1.0.0'};
oM('Confirm Execution',`<div class="exec-pre"><div class="tx f7 tm uc">Execution Packet</div><pre>${esc(JSON.stringify(pkt,null,2))}</pre></div><div class="fx jcb aic mb12 mt12"><div><span class="tx tm f6">Idempotency Key:</span><span class="mono ta ts" style="margin-left:8px">${ik}</span></div><div class="tx tm">POST /api/ccil/submit</div></div><div class="exec-life"><div class="exec-step" id="es1"></div><div class="exec-step" id="es2"></div><div class="exec-step" id="es3"></div></div><div class="fx gap8 mt12"><button class="bp" id="execBtn" onclick="execConfirmed('${rid}','${ik}')">Confirm Execute</button><button class="bs" onclick="cM()">Cancel</button></div>`)}

function execConfirmed(rid,ik){
if(Z.usedIKs.has(ik)){toast(`Duplicate IK: ${ik} — existing execution returned (409)`,'error');cM();return}
Z.usedIKs.add(ik);
const r=Z.req.find(x=>x.request_id===rid);if(!r)return;
const eid=`EX-${Z.exc++}`;
Z.exec.unshift({execution_id:eid,request_id:rid,counterparty:'—',amount:r.amount,rate:r.requested_rate,collateral:r.collateral.map(c=>c.isin).join(', '),venue:r.preferred_venue,status:'Submitted',timestamp:now(),ik});
r.status='Submitted to CCIL';
addA(`user_${Z.role.toLowerCase()}_1`,'Executed → CCIL',eid,'execution',{ik,trace_id:trid()});
// Show progress in modal
const btn=document.getElementById('execBtn');if(btn){btn.disabled=true;btn.textContent='Submitting...'}
const s1=document.getElementById('es1');if(s1)s1.className='exec-step done';
stateChanged(`${eid} submitted`);
// Phase 2: Pending Settlement (2s)
setTimeout(()=>{const ex=Z.exec.find(e=>e.execution_id===eid);if(ex)ex.status='Pending Settlement';r.status='Pending Settlement';const s2=document.getElementById('es2');if(s2)s2.className='exec-step active';if(btn)btn.textContent='Pending Settlement...';addA('SYSTEM','execution_update → pending',eid,'system',{trace_id:trid()});if(Z.tab==='execution')rExec();toast(`${eid} → Pending Settlement`,'info')},2000);
// Phase 3: Settled or Failed (5s)
setTimeout(()=>{const fail=Math.random()<.15;const ex=Z.exec.find(e=>e.execution_id===eid);if(ex){ex.status=fail?'Failed':'Settled';ex.timestamp=now()}
r.status=fail?'Failed':'Settled';
// ATOMIC: On settled, encumber collateral + publish encumbrance_event + metric_update
if(!fail){r.collateral.forEach(rc=>{const c=Z.col.find(x=>x.isin===rc.isin);if(c){c.encumbered=true;c.reserved_by=null}});
addA('SYSTEM','encumbrance_event',eid,'system',{isins:r.collateral.map(c=>c.isin),encumbered:true,trace_id:trid()})}
addA('SYSTEM',fail?'settlement_failure':'execution_update → settled',eid,'system',{status:fail?'Failed':'Settled',ik,trace_id:trid()});
cM();stateChanged(fail?`${eid} FAILED`:`${eid} settled — collateral encumbered — metrics updated atomically`)},5000)}

function retryExec(eid){const ex=Z.exec.find(e=>e.execution_id===eid);if(!ex)return;
const newIk=`IK-${ex.request_id}-${Date.now().toString(36)}`;Z.usedIKs.add(newIk);
ex.status='Submitted';ex.timestamp=now();ex.ik=newIk;
addA(Z.role,'Retried (new IK)',eid,'execution',{ik:newIk,trace_id:trid()});
toast(`${eid} retrying...`,'info');rExec();
setTimeout(()=>{ex.status='Settled';ex.timestamp=now();const r=Z.req.find(x=>x.request_id===ex.request_id);if(r){r.status='Settled';r.collateral.forEach(rc=>{const c=Z.col.find(x=>x.isin===rc.isin);if(c){c.encumbered=true;c.reserved_by=null}})}addA('SYSTEM','Settled (retry)',eid,'system',{trace_id:trid()});stateChanged(`${eid} settled on retry`)},3000)}
